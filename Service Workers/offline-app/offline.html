<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f8d7da;
        }

        .box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;

            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        h1 {
            color: red;
            margin-bottom: 15px;
        }

    </style>

</head>
<body>

    <div class="box">
        <h1>No Internet Connection</h1>

        <p>
            Please check your network and try again.
        </p>
    </div>

</body>
</html>
